name: Update Madeira events

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

# Serialize with the news workflow so the two never push to main at once
concurrency:
  group: madeira-data-commit
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Export Madeira events
        run: python scripts/export_madeira_events.py

      - name: Commit & push (rebase-safe)
        run: |
          git config user.name "Kirill Shpara"
          git config user.email "125877659+kirshp@users.noreply.github.com"
          git add madeira/events.json
          if git diff --cached --quiet; then echo "No changes — nothing to commit."; exit 0; fi
          git commit -m "Update Madeira events"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git rebase -X theirs origin/main || { git rebase --abort; sleep 3; continue; }
            if git push origin HEAD:main; then echo "Pushed on attempt $attempt."; exit 0; fi
            echo "Push rejected — main moved; retry $attempt."; sleep $((attempt * 4))
          done
          echo "Could not push after retries."; exit 1
