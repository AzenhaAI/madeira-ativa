name: Update Madeira events

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Export Madeira events
        run: python scripts/export_madeira_events.py

      - name: Commit updated events
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update Madeira events"
          commit_user_name: Kirill Shpara
          commit_user_email: 125877659+kirshp@users.noreply.github.com
          commit_author: Kirill Shpara <125877659+kirshp@users.noreply.github.com>
          file_pattern: madeira/events.json
