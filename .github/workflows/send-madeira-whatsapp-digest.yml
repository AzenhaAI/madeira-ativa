name: Send Madeira WhatsApp digest

on:
  schedule:
    - cron: "50 5 * * *"
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  send:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Send WhatsApp digest
        env:
          WHATSAPP_TOKEN: ${{ secrets.WHATSAPP_TOKEN }}
          WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
          WHATSAPP_RECIPIENT: ${{ secrets.WHATSAPP_RECIPIENT }}
          MADEIRA_DIGEST_MODE: trail
          MADEIRA_DIGEST_MONTHS: "2"
        run: |
          if [ -z "$WHATSAPP_TOKEN" ] || [ -z "$WHATSAPP_PHONE_NUMBER_ID" ]; then
            echo "WhatsApp credentials not configured; skipping digest."
            exit 0
          fi
          python scripts/send_madeira_whatsapp.py
