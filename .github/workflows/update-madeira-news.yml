name: Update Madeira news & broadcasts

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch news (RSS + translations)
        run: python scripts/fetch_news.py
        continue-on-error: true

      - name: Fetch TV broadcasts
        run: python scripts/fetch_broadcasts.py
        continue-on-error: true

      - name: Fetch trail status
        run: python scripts/fetch_trails.py
        continue-on-error: true

      - name: Fetch trail geometry (OSM)
        run: python scripts/fetch_trail_geometry.py
        continue-on-error: true

      - name: Build levada guide (OSM + elevation)
        run: python scripts/fetch_levadas.py
        continue-on-error: true

      - name: Check Trail Madeira calendar PDF
        run: python scripts/check_trail_pdf.py
        continue-on-error: true

      - name: Commit updated feeds
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update Madeira news, broadcasts & trail status"
          commit_user_name: Kirill Shpara
          commit_user_email: 125877659+kirshp@users.noreply.github.com
          commit_author: Kirill Shpara <125877659+kirshp@users.noreply.github.com>
          file_pattern: madeira/news_feed.json madeira/tv_broadcasts.json madeira/trails_status.json madeira/trails_geo.json madeira/levadas.json madeira/trail_calendar.json
