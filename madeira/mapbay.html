<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Madeira Levadas — Aerial</title>
<link rel="icon" href="/madeira/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/madeira/icon-192.png?v=5e8787d">
<link href="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.css" rel="stylesheet">
<script src="https://unpkg.com/maplibre-gl@4.7.1/dist/maplibre-gl.js"></script>
<style>
  html, body { margin: 0; height: 100%; background: #05070b; font-family: Inter, system-ui, sans-serif; }
  #map { position: absolute; inset: 0; }
  .topbar { position: absolute; top: 12px; left: 12px; z-index: 5; display: flex; gap: 10px; align-items: center;
    background: rgba(6,9,14,0.78); backdrop-filter: blur(8px); padding: 8px 12px; border-radius: 10px; }
  .topbar a { color: #d7e3da; text-decoration: none; font-size: 14px; font-weight: 600; }
  .topbar a:hover { color: #fff; } .title { color: #fff; font-weight: 700; font-size: 14px; }
  .ctrl { position: absolute; top: 12px; right: 12px; z-index: 5; display: flex; flex-direction: column; gap: 8px; align-items: flex-end; }
  .ctrl button { background: rgba(6,9,14,0.8); color: #d7e3da; border: 1px solid rgba(255,255,255,0.15);
    border-radius: 8px; padding: 7px 12px; font: inherit; font-size: 13px; font-weight: 600; cursor: pointer; backdrop-filter: blur(8px); }
  .ctrl button:hover { color: #fff; }
  .layers { display: flex; flex-direction: column; gap: 6px; background: rgba(6,9,14,0.8); backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,0.15); border-radius: 10px; padding: 9px 11px; }
  .layers-title { font-size: 11px; font-weight: 700; letter-spacing: 0.05em; text-transform: uppercase; color: #8fa39a; margin-bottom: 1px; }
  .layer-btn { display: flex; align-items: center; gap: 8px; background: none; border: 0; color: #d7e3da; font: inherit;
    font-size: 13px; font-weight: 600; cursor: pointer; padding: 2px 0; text-align: left; }
  .layer-btn .dot { width: 13px; height: 13px; border-radius: 3px; border: 1px solid rgba(255,255,255,0.3); flex-shrink: 0; }
  .layer-btn.on .dot { background: currentColor; border-color: currentColor; }
  .layer-btn:hover { color: #fff; }
  .legend { position: absolute; bottom: 16px; left: 50%; transform: translateX(-50%); z-index: 5; display: flex; gap: 14px;
    background: rgba(6,9,14,0.78); backdrop-filter: blur(8px); padding: 9px 16px; border-radius: 999px; color: #d7e3da; font-size: 13px; }
  .legend span { display: inline-flex; align-items: center; gap: 6px; } .legend i { width: 14px; height: 4px; border-radius: 2px; }
</style>
</head>
<body>
<div id="map"></div>
<div class="topbar"><a href="/madeira/levada">← Levadas</a><span class="title">Madeira · Aerial</span></div>
<div class="ctrl">
  <button id="orbit">⏸ Pause orbit</button>
  <div class="layers">
    <div class="layers-title">Layers</div>
    <button class="layer-btn on" data-layer="levadas" style="color:#3ee07f"><span class="dot"></span>Levadas (PR)</button>
    <button class="layer-btn" data-layer="alllevadas" style="color:#46c7d6"><span class="dot"></span>All levadas</button>
    <button class="layer-btn" data-layer="cities" style="color:#cfe0ff"><span class="dot"></span>Cities &amp; labels</button>
    <button class="layer-btn" data-layer="roads" style="color:#ffd9a6"><span class="dot"></span>Roads</button>
    <button class="layer-btn" data-layer="tunnels" style="color:#7fe3ff"><span class="dot"></span>Tunnels</button>
  </div>
</div>
<div class="legend">
  <span><i style="background:#3ee07f"></i> Open</span>
  <span><i style="background:#ffb24d"></i> Restricted</span>
  <span><i style="background:#ff5a4d"></i> Closed</span>
</div>

<script>
const STATUS_COLOR = { open: '#3ee07f', partial: '#ffb24d', closed: '#ff5a4d' };
const CENTER = [-16.95, 32.74];
let MAP, orbiting = true, raf = null;

function orbit() {
  if (!orbiting) return;
  MAP.setBearing((MAP.getBearing() + 0.035) % 360);
  raf = requestAnimationFrame(orbit);
}

function build(features) {
  const map = new maplibregl.Map({
    container: 'map', center: CENTER, zoom: 11.3, pitch: 60, bearing: 0, maxPitch: 80,
    attributionControl: { compact: true },
    style: {
      version: 8,
      sources: {
        sat: {
          type: 'raster',
          tiles: ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],
          tileSize: 256, maxzoom: 18, attribution: 'Imagery © Esri, Maxar, Earthstar Geographics'
        },
        dem: {
          type: 'raster-dem',
          tiles: ['https://elevation-tiles-prod.s3.amazonaws.com/terrarium/{z}/{x}/{y}.png'],
          encoding: 'terrarium', tileSize: 256, maxzoom: 14, attribution: 'Terrain © Mapzen / AWS'
        },
        levadas: { type: 'geojson', data: { type: 'FeatureCollection', features } },
        alllevadas: { type: 'geojson', data: { type: 'FeatureCollection', features: [] } },
        tunnels: { type: 'geojson', data: { type: 'FeatureCollection', features: [] } },
        refplaces: {
          type: 'raster', tileSize: 256, maxzoom: 18,
          tiles: ['https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}'],
          attribution: 'Labels © Esri'
        },
        reftrans: {
          type: 'raster', tileSize: 256, maxzoom: 18,
          tiles: ['https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Transportation/MapServer/tile/{z}/{y}/{x}'],
          attribution: 'Roads © Esri'
        }
      },
      layers: [
        { id: 'sat', type: 'raster', source: 'sat', paint: { 'raster-saturation': 0.15, 'raster-contrast': 0.08 } },
        { id: 'roads', type: 'raster', source: 'reftrans', layout: { visibility: 'none' } },
        { id: 'cities', type: 'raster', source: 'refplaces', layout: { visibility: 'none' } },
        { id: 'alllevadas-line', type: 'line', source: 'alllevadas', layout: { visibility: 'none', 'line-cap': 'round', 'line-join': 'round' },
          paint: { 'line-color': '#5fd8e6', 'line-width': ['interpolate', ['linear'], ['zoom'], 10, 1.3, 15, 3], 'line-opacity': 0.75 } },
        { id: 'tunnels-line', type: 'line', source: 'tunnels', layout: { visibility: 'none', 'line-cap': 'round', 'line-join': 'round' },
          paint: { 'line-color': '#7fe3ff', 'line-width': 2.5, 'line-opacity': 0.9, 'line-dasharray': [2, 2] } },
        { id: 'levadas-glow', type: 'line', source: 'levadas',
          layout: { 'line-cap': 'round', 'line-join': 'round' },
          paint: { 'line-color': ['get', 'color'], 'line-width': 10, 'line-opacity': 0.35, 'line-blur': 6 } },
        { id: 'levadas-line', type: 'line', source: 'levadas',
          layout: { 'line-cap': 'round', 'line-join': 'round' },
          paint: { 'line-color': ['get', 'color'], 'line-width': ['interpolate', ['linear'], ['zoom'], 10, 2, 15, 4.5], 'line-opacity': 1 } },
        { id: 'levadas-hover', type: 'line', source: 'levadas',
          filter: ['==', ['get', 'code'], '__none__'],
          layout: { 'line-cap': 'round', 'line-join': 'round' },
          paint: { 'line-color': '#ffffff', 'line-width': 6, 'line-opacity': 0.9 } }
      ],
      terrain: { source: 'dem', exaggeration: 1.6 },
      sky: {}
    }
  });
  MAP = map;
  map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), 'bottom-right');

  map.on('click', 'levadas-line', e => {
    const p = e.features[0].properties;
    const label = p.status === 'closed' ? 'Closed' : p.status === 'partial' ? 'Partially open' : 'Open';
    new maplibregl.Popup({ closeButton: true })
      .setLngLat(e.lngLat)
      .setHTML(`<h3 style="margin:0 0 4px">${p.code} — ${p.name}</h3><div style="color:${p.color};font-weight:700">${label}</div>`)
      .addTo(map);
  });
  const tip = new maplibregl.Popup({ closeButton: false, closeOnClick: false, offset: 12 });
  map.on('mousemove', 'levadas-line', e => {
    map.getCanvas().style.cursor = 'pointer';
    const p = e.features[0].properties;
    map.setFilter('levadas-hover', ['==', ['get', 'code'], p.code]);
    tip.setLngLat(e.lngLat).setHTML(`<b>${p.code}</b> — ${p.name}`).addTo(map);
  });
  map.on('mouseleave', 'levadas-line', () => {
    map.getCanvas().style.cursor = '';
    map.setFilter('levadas-hover', ['==', ['get', 'code'], '__none__']);
    tip.remove();
  });

  // Start orbit once the first frame is up.
  setTimeout(() => { orbiting = true; orbit(); }, 1500);

  const btn = document.getElementById('orbit');
  btn.onclick = () => {
    orbiting = !orbiting;
    btn.textContent = orbiting ? '⏸ Pause orbit' : '▶ Resume orbit';
    if (orbiting) orbit(); else if (raf) cancelAnimationFrame(raf);
  };
  // Pause orbit while the user is dragging.
  map.on('dragstart', () => { if (orbiting) { orbiting = false; btn.textContent = '▶ Resume orbit'; } });

  // Layer toggles
  const LAYER_IDS = {
    levadas: ['levadas-glow', 'levadas-line'],
    alllevadas: ['alllevadas-line'],
    cities: ['cities'],
    roads: ['roads'],
    tunnels: ['tunnels-line'],
  };
  const loaded = {};

  function setLayer(name, on) {
    LAYER_IDS[name].forEach(id => {
      if (map.getLayer(id)) map.setLayoutProperty(id, 'visibility', on ? 'visible' : 'none');
    });
    if (on && name === 'tunnels' && !loaded.tunnels) {
      loadOverpass('tunnels', '(way["tunnel"="yes"]["highway"](area.a););');
    }
    if (on && name === 'alllevadas' && !loaded.alllevadas) {
      loadOverpass('alllevadas', '(way["waterway"]["name"~"[Ll]evada"](area.a););');
    }
  }

  function loadOverpass(srcId, body) {
    loaded[srcId] = true;
    const q = '[out:json][timeout:120];area["ISO3166-2"="PT-30"]->.a;' + body + 'out geom;';
    fetch('https://overpass-api.de/api/interpreter', { method: 'POST', body: 'data=' + encodeURIComponent(q) })
      .then(r => r.json())
      .then(d => {
        const feats = (d.elements || []).filter(e => e.geometry).map(e => ({
          type: 'Feature',
          properties: { name: e.tags && (e.tags.name || e.tags.ref) || '' },
          geometry: { type: 'LineString', coordinates: e.geometry.map(p => [p.lon, p.lat]) }
        }));
        if (map.getSource(srcId)) map.getSource(srcId).setData({ type: 'FeatureCollection', features: feats });
      })
      .catch(() => { loaded[srcId] = false; });
  }

  document.querySelectorAll('.layer-btn').forEach(b => {
    b.onclick = () => {
      const on = !b.classList.contains('on');
      b.classList.toggle('on', on);
      setLayer(b.getAttribute('data-layer'), on);
    };
  });
}

fetch('trails_geo.json').then(r => r.json()).then(data => {
  const features = (data.trails || []).map(t => ({
    type: 'Feature',
    properties: { code: t.code, name: t.name, status: t.status, color: STATUS_COLOR[t.status] || '#3ee07f' },
    geometry: { type: 'MultiLineString', coordinates: (t.lines || []).map(line => line.map(p => [p[1], p[0]])) }
  }));
  build(features);
}).catch(() => build([]));
</script>
</body>
</html>
