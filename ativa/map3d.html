<body>
<div id="map"></div>
<div class="topbar">
  <a href="/ativa/">🏠 Main</a>
  <a href="/ativa/levada">← Levadas</a>
  <span class="title">Madeira 3D</span>
</div>
<div class="hint">drag = move · right-drag = rotate · scroll = zoom</div>
<div class="layers">
  <div class="layers-title">Layers</div>
  <button class="layer-btn on" data-layer="levadas" style="color:#2e9e5b"><span class="dot"></span>Levadas (PR)</button>
  <button class="layer-btn" data-layer="alllevadas" style="color:#1f78b4"><span class="dot"></span>All levadas</button>
  <button class="layer-btn" data-layer="cities" style="color:#3b6ea5"><span class="dot"></span>Cities &amp; labels</button>
  <button class="layer-btn" data-layer="roads" style="color:#a5762e"><span class="dot"></span>Roads</button>
  <button class="layer-btn" data-layer="tunnels" style="color:#9a4fd0"><span class="dot"></span>Tunnels</button>
</div>
<div class="legend">
  <span><i style="background:#2e9e5b"></i> Open</span>
  <span><i style="background:#e0902a"></i> Restricted</span>
  <span><i style="background:#e23b2e"></i> Closed</span>
</div>

<script>
const STATUS_COLOR = { open: '#2e9e5b', partial: '#e0902a', closed: '#e23b2e' };

function buildMap(trailFeatures) {
  const map = new maplibregl.Map({
    container: 'map',
    center: [-16.95, 32.74],
    zoom: 10.4,
    pitch: 68,
    bearing: -18,
    maxPitch: 85,
    hash: false,
    attributionControl: { compact: true },
    style: {
      version: 8,
      glyphs: 'https://demotiles.maplibre.org/font/{fontstack}/{range}.pbf',
      sources: {
        topo: {
          type: 'raster',
          tiles: ['https://a.tile.opentopomap.org/{z}/{x}/{y}.png',
                  'https://b.tile.opentopomap.org/{z}/{x}/{y}.png',
                  'https://c.tile.opentopomap.org/{z}/{x}/{y}.png'],
          tileSize: 256, maxzoom: 17,
          attribution: '© OpenTopoMap (CC-BY-SA) · SRTM'
        },
        dem: {
          type: 'raster-dem',
          tiles: ['https://elevation-tiles-prod.s3.amazonaws.com/terrarium/{z}/{x}/{y}.png'],
          encoding: 'terrarium', tileSize: 256, maxzoom: 14,
          attribution: 'Terrain © Mapzen / AWS'
        },
        levadas: { type: 'geojson', data: { type: 'FeatureCollection', features: trailFeatures } },
        alllevadas: { type: 'geojson', data: { type: 'FeatureCollection', features: [] } },
        tunnels: { type: 'geojson', data: { type: 'FeatureCollection', features: [] } },
        refplaces: { type: 'raster', tileSize: 256, maxzoom: 18,
          tiles: ['https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}'], attribution: 'Labels © Esri' },
        reftrans: { type: 'raster', tileSize: 256, maxzoom: 18,
          tiles: ['https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Transportation/MapServer/tile/{z}/{y}/{x}'], attribution: 'Roads © Esri' }
      },
      layers: [
        { id: 'topo', type: 'raster', source: 'topo' },
        { id: 'hills', type: 'hillshade', source: 'dem',
          paint: { 'hillshade-exaggeration': 0.5, 'hillshade-shadow-color': '#21281f' } },
        { id: 'roads', type: 'raster', source: 'reftrans', layout: { visibility: 'none' } },
        { id: 'cities', type: 'raster', source: 'refplaces', layout: { visibility: 'none' } },
        { id: 'alllevadas-line', type: 'line', source: 'alllevadas', layout: { visibility: 'none', 'line-cap': 'round', 'line-join': 'round' },
          paint: { 'line-color': '#1f78b4', 'line-width': ['interpolate', ['linear'], ['zoom'], 10, 1.3, 15, 3], 'line-opacity': 0.7 } },
        { id: 'tunnels-line', type: 'line', source: 'tunnels', layout: { visibility: 'none', 'line-cap': 'round', 'line-join': 'round' },
          paint: { 'line-color': '#b25fd6', 'line-width': 2.5, 'line-opacity': 0.9, 'line-dasharray': [2, 2] } },
        { id: 'levadas-glow', type: 'line', source: 'levadas',
          layout: { 'line-cap': 'round', 'line-join': 'round' },
          paint: { 'line-color': ['get', 'color'], 'line-width': 7, 'line-opacity': 0.25, 'line-blur': 4 } },
        { id: 'levadas-line', type: 'line', source: 'levadas',
          layout: { 'line-cap': 'round', 'line-join': 'round' },
          paint: {
            'line-color': ['get', 'color'],
            'line-width': ['interpolate', ['linear'], ['zoom'], 10, 2, 14, 4.5],
            'line-opacity': 0.95
          } },
        { id: 'levadas-hover', type: 'line', source: 'levadas',
          filter: ['==', ['get', 'code'], '__none__'],
          layout: { 'line-cap': 'round', 'line-join': 'round' },
          paint: { 'line-color': '#ffffff', 'line-width': 6, 'line-opacity': 0.9 } }
      ],
      terrain: { source: 'dem', exaggeration: 1.5 },
      sky: {}
    }
  });

  map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), 'top-right');
  map.addControl(new maplibregl.TerrainControl({ source: 'dem', exaggeration: 1.5 }), 'top-right');

  map.on('click', 'levadas-line', e => {
    const p = e.features[0].properties;
    const label = p.status === 'closed' ? 'Closed' : p.status === 'partial' ? 'Partially open' : 'Open';
    new maplibregl.Popup({ closeButton: false })
      .setLngLat(e.lngLat)
      .setHTML(`<h3>${p.code} — ${p.name}</h3><div style="color:${p.color};font-weight:700">${label}</div>`)
      .addTo(map);
  });

  const tip = new maplibregl.Popup({ closeButton: false, closeOnClick: false, offset: 12, className: 'trail-tip' });
  map.on('mousemove', 'levadas-line', e => {
    map.getCanvas().style.cursor = 'pointer';
    const p = e.features[0].properties;
    map.setFilter('levadas-hover', ['==', ['get', 'code'], p.code]);
    tip.setLngLat(e.lngLat).setHTML(`<b>${p.code}</b> — ${p.name}`).addTo(map);
  });
  map.on('mouseleave', 'levadas-line', () => {
    map.getCanvas().style.cursor = '';
    map.setFilter('levadas-hover', ['==', ['get', 'code'], '__none__']);
    tip.remove();
  });

  setupLayerToggles(map);
}

function setupLayerToggles(map) {
  const IDS = {
    levadas: ['levadas-glow', 'levadas-line'],
    alllevadas: ['alllevadas-line'],
    cities: ['cities'],
    roads: ['roads'],
    tunnels: ['tunnels-line'],
  };
  const loaded = {};
  function load(srcId, body) {
    loaded[srcId] = true;
    const q = '[out:json][timeout:120];area["ISO3166-2"="PT-30"]->.a;' + body + 'out geom;';
    fetch('https://overpass-api.de/api/interpreter', { method: 'POST', body: 'data=' + encodeURIComponent(q) })
      .then(r => r.json())
      .then(d => {
        const feats = (d.elements || []).filter(e => e.geometry).map(e => ({
          type: 'Feature', properties: {},
          geometry: { type: 'LineString', coordinates: e.geometry.map(p => [p.lon, p.lat]) }
        }));
        if (map.getSource(srcId)) map.getSource(srcId).setData({ type: 'FeatureCollection', features: feats });
      }).catch(() => { loaded[srcId] = false; });
  }
  document.querySelectorAll('.layer-btn').forEach(b => {
    b.onclick = () => {
      const name = b.getAttribute('data-layer');
      const on = !b.classList.contains('on');
      b.classList.toggle('on', on);
      IDS[name].forEach(id => { if (map.getLayer(id)) map.setLayoutProperty(id, 'visibility', on ? 'visible' : 'none'); });
      if (on && name === 'tunnels' && !loaded.tunnels) load('tunnels', '(way["tunnel"="yes"]["highway"](area.a););');
      if (on && name === 'alllevadas' && !loaded.alllevadas) load('alllevadas', '(way["waterway"]["name"~"[Ll]evada"](area.a););');
    };
  });
}

fetch('trails_geo.json').then(r => r.json()).then(data => {
  const features = (data.trails || []).map(t => ({
    type: 'Feature',
    properties: { code: t.code, name: t.name, status: t.status, color: STATUS_COLOR[t.status] || '#2e9e5b' },
    geometry: { type: 'MultiLineString', coordinates: (t.lines || []).map(line => line.map(p => [p[1], p[0]])) }
  }));
  buildMap(features);
}).catch(() => buildMap([]));
</script>
</body>
