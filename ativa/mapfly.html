<body>
<div id="map"></div>
<div class="topbar"><a href="/ativa/">🏠 Main</a><a href="/ativa/levada">← Levadas</a><span class="title">Madeira · Flyover</span></div>
<div class="hint">click a trail → fly along it</div>
<div class="layers">
  <div class="layers-title">Layers</div>
  <button class="layer-btn on" data-layer="levadas" style="color:#34d27b"><span class="dot"></span>Levadas (PR)</button>
  <button class="layer-btn" data-layer="alllevadas" style="color:#5fd8e6"><span class="dot"></span>All levadas</button>
  <button class="layer-btn" data-layer="cities" style="color:#cfe0ff"><span class="dot"></span>Cities &amp; labels</button>
  <button class="layer-btn" data-layer="roads" style="color:#ffd9a6"><span class="dot"></span>Roads</button>
  <button class="layer-btn" data-layer="tunnels" style="color:#7fe3ff"><span class="dot"></span>Tunnels</button>
</div>
<div class="legend">
  <span><i style="background:#2e9e5b"></i> Open</span>
  <span><i style="background:#e0902a"></i> Restricted</span>
  <span><i style="background:#e23b2e"></i> Closed</span>
</div>

<script>
const STATUS_COLOR = { open: '#34d27b', partial: '#f0a83a', closed: '#ff5a4d' };
let MAP, MARKERS = [];

function clearMarkers() { MARKERS.forEach(m => m.remove()); MARKERS = []; }

function addMarker(lngLat, cls) {
  const el = document.createElement('div');
  el.className = 'marker ' + cls;
  const m = new maplibregl.Marker({ element: el }).setLngLat(lngLat).addTo(MAP);
  MARKERS.push(m);
}

function bearingBetween(a, b) {
  const y = Math.sin((b[0] - a[0]) * Math.PI / 180) * Math.cos(b[1] * Math.PI / 180);
  const x = Math.cos(a[1] * Math.PI / 180) * Math.sin(b[1] * Math.PI / 180) -
            Math.sin(a[1] * Math.PI / 180) * Math.cos(b[1] * Math.PI / 180) * Math.cos((b[0] - a[0]) * Math.PI / 180);
  return Math.atan2(y, x) * 180 / Math.PI;
}

function flyAlong(coords) {
  if (coords.length < 2) return;
  clearMarkers();
  addMarker(coords[0], 'start');
  addMarker(coords[coords.length - 1], 'end');
  let i = 0;
  const step = Math.max(1, Math.floor(coords.length / 60));
  MAP.easeTo({ center: coords[0], zoom: 14.5, pitch: 74, bearing: bearingBetween(coords[0], coords[Math.min(step, coords.length - 1)]), duration: 1200 });
  let t = setInterval(() => {
    i += step;
    if (i >= coords.length) { clearInterval(t); return; }
    const next = coords[Math.min(i + step, coords.length - 1)];
    MAP.easeTo({ center: coords[i], bearing: bearingBetween(coords[i], next), duration: 700, easing: x => x });
  }, 650);
}

function build(features) {
  const map = new maplibregl.Map({
    container: 'map', center: [-16.95, 32.74], zoom: 10.6, pitch: 70, bearing: -15, maxPitch: 85,
    attributionControl: { compact: true },
    style: {
      version: 8,
      sources: {
        sat: {
          type: 'raster',
          tiles: ['https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}'],
          tileSize: 256, maxzoom: 18, attribution: 'Imagery © Esri, Maxar, Earthstar Geographics'
        },
        dem: {
          type: 'raster-dem',
          tiles: ['https://elevation-tiles-prod.s3.amazonaws.com/terrarium/{z}/{x}/{y}.png'],
          encoding: 'terrarium', tileSize: 256, maxzoom: 14, attribution: 'Terrain © Mapzen / AWS'
        },
        levadas: { type: 'geojson', data: { type: 'FeatureCollection', features } },
        alllevadas: { type: 'geojson', data: { type: 'FeatureCollection', features: [] } },
        tunnels: { type: 'geojson', data: { type: 'FeatureCollection', features: [] } },
        refplaces: { type: 'raster', tileSize: 256, maxzoom: 18,
          tiles: ['https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Boundaries_and_Places/MapServer/tile/{z}/{y}/{x}'], attribution: 'Labels © Esri' },
        reftrans: { type: 'raster', tileSize: 256, maxzoom: 18,
          tiles: ['https://server.arcgisonline.com/ArcGIS/rest/services/Reference/World_Transportation/MapServer/tile/{z}/{y}/{x}'], attribution: 'Roads © Esri' }
      },
      layers: [
        { id: 'sat', type: 'raster', source: 'sat' },
        { id: 'roads', type: 'raster', source: 'reftrans', layout: { visibility: 'none' } },
        { id: 'cities', type: 'raster', source: 'refplaces', layout: { visibility: 'none' } },
        { id: 'alllevadas-line', type: 'line', source: 'alllevadas', layout: { visibility: 'none', 'line-cap': 'round', 'line-join': 'round' },
          paint: { 'line-color': '#5fd8e6', 'line-width': ['interpolate', ['linear'], ['zoom'], 10, 1.3, 15, 3], 'line-opacity': 0.75 } },
        { id: 'tunnels-line', type: 'line', source: 'tunnels', layout: { visibility: 'none', 'line-cap': 'round', 'line-join': 'round' },
          paint: { 'line-color': '#7fe3ff', 'line-width': 2.5, 'line-opacity': 0.9, 'line-dasharray': [2, 2] } },
        { id: 'levadas-glow', type: 'line', source: 'levadas',
          layout: { 'line-cap': 'round', 'line-join': 'round' },
          paint: { 'line-color': ['get', 'color'], 'line-width': 8, 'line-opacity': 0.3, 'line-blur': 4 } },
        { id: 'levadas-line', type: 'line', source: 'levadas',
          layout: { 'line-cap': 'round', 'line-join': 'round' },
          paint: { 'line-color': ['get', 'color'], 'line-width': ['interpolate', ['linear'], ['zoom'], 10, 2.5, 15, 5], 'line-opacity': 1 } },
        { id: 'levadas-hover', type: 'line', source: 'levadas',
          filter: ['==', ['get', 'code'], '__none__'],
          layout: { 'line-cap': 'round', 'line-join': 'round' },
          paint: { 'line-color': '#ffffff', 'line-width': 7, 'line-opacity': 0.9 } }
      ],
      terrain: { source: 'dem', exaggeration: 1.5 },
      sky: {}
    }
  });
  MAP = map;
  map.addControl(new maplibregl.NavigationControl({ visualizePitch: true }), 'top-right');
  let pendingDone = false;
  const tryPendingFly = () => {
    if (pendingDone || window._pendingFly === null) return;
    pendingDone = true;
    setTimeout(() => window._fly(window._pendingFly), 500);
  };
  map.on('load', tryPendingFly);
  setTimeout(tryPendingFly, 2500); // fallback: slow tiles must not block the flyover

  map.on('click', 'levadas-line', e => {
    const p = e.features[0].properties;
    const label = p.status === 'closed' ? 'Closed' : p.status === 'partial' ? 'Partially open' : 'Open';
    const coords = JSON.parse(p.coords);
    new maplibregl.Popup({ closeButton: true })
      .setLngLat(e.lngLat)
      .setHTML(`<h3>${p.code} — ${p.name}</h3><div style="color:${p.color};font-weight:700">${label}</div>` +
               `<button class="fly-btn" onclick="window._fly(${p.fid})">▶ Fly along</button>`)
      .addTo(map);
  });
  const tip = new maplibregl.Popup({ closeButton: false, closeOnClick: false, offset: 12 });
  map.on('mousemove', 'levadas-line', e => {
    map.getCanvas().style.cursor = 'pointer';
    const p = e.features[0].properties;
    map.setFilter('levadas-hover', ['==', ['get', 'code'], p.code]);
    tip.setLngLat(e.lngLat).setHTML(`<b>${p.code}</b> — ${p.name}`).addTo(map);
  });
  map.on('mouseleave', 'levadas-line', () => {
    map.getCanvas().style.cursor = '';
    map.setFilter('levadas-hover', ['==', ['get', 'code'], '__none__']);
    tip.remove();
  });

  const IDS = { levadas: ['levadas-glow', 'levadas-line'], alllevadas: ['alllevadas-line'], cities: ['cities'], roads: ['roads'], tunnels: ['tunnels-line'] };
  const loaded = {};
  function load(srcId, body) {
    loaded[srcId] = true;
    const q = '[out:json][timeout:120];area["ISO3166-2"="PT-30"]->.a;' + body + 'out geom;';
    fetch('https://overpass-api.de/api/interpreter', { method: 'POST', body: 'data=' + encodeURIComponent(q) })
      .then(r => r.json())
      .then(d => {
        const feats = (d.elements || []).filter(e => e.geometry).map(e => ({
          type: 'Feature', properties: {}, geometry: { type: 'LineString', coordinates: e.geometry.map(p => [p.lon, p.lat]) }
        }));
        if (map.getSource(srcId)) map.getSource(srcId).setData({ type: 'FeatureCollection', features: feats });
      }).catch(() => { loaded[srcId] = false; });
  }
  document.querySelectorAll('.layer-btn').forEach(b => {
    b.onclick = () => {
      const name = b.getAttribute('data-layer');
      const on = !b.classList.contains('on');
      b.classList.toggle('on', on);
      IDS[name].forEach(id => { if (map.getLayer(id)) map.setLayoutProperty(id, 'visibility', on ? 'visible' : 'none'); });
      if (on && name === 'tunnels' && !loaded.tunnels) load('tunnels', '(way["tunnel"="yes"]["highway"](area.a););');
      if (on && name === 'alllevadas' && !loaded.alllevadas) load('alllevadas', '(way["waterway"]["name"~"[Ll]evada"](area.a););');
    };
  });
}

window._flyData = [];
window._fly = function (fid) { flyAlong(window._flyData[fid]); };
window._pendingFly = null;

fetch('trails_geo.json').then(r => r.json()).then(data => {
  const norm = s => String(s || '').replace(/[\s.]/g, '').toLowerCase();
  const want = norm(new URLSearchParams(location.search).get('trail'));
  const features = (data.trails || []).map((t, idx) => {
    // longest segment = the main route for flyover
    const longest = (t.lines || []).slice().sort((a, b) => b.length - a.length)[0] || [];
    const coords = longest.map(p => [p[1], p[0]]);
    window._flyData[idx] = coords;
    if (want && norm(t.code) === want && window._pendingFly === null) window._pendingFly = idx;
    return {
      type: 'Feature',
      properties: { code: t.code, name: t.name, status: t.status, color: STATUS_COLOR[t.status] || '#34d27b', fid: idx, coords: JSON.stringify(coords) },
      geometry: { type: 'MultiLineString', coordinates: (t.lines || []).map(line => line.map(p => [p[1], p[0]])) }
    };
  });
  build(features);
}).catch(() => build([]));
</script>
